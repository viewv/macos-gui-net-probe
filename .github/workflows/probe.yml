name: probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Install as input method + register
        run: |
          set -x
          curl -fL --retry 3 -o /tmp/app.zip "https://download.weread.qq.com/app/wxkb/mac/3.0.1/WeType_3.0.1_684.zip"
          rm -rf /tmp/app && mkdir -p /tmp/app && unzip -q /tmp/app.zip -d /tmp/app
          sudo mkdir -p "/Library/Input Methods"
          sudo rm -rf "/Library/Input Methods/WeType.app"
          sudo cp -R "/tmp/app/WeType.app" "/Library/Input Methods/"
          sudo chown -R root:wheel "/Library/Input Methods/WeType.app"
          sudo xattr -dr com.apple.quarantine "/Library/Input Methods/WeType.app" || true
          sudo spctl --master-disable || true
          cat > /tmp/reg.c <<'EOF'
          #include <Carbon/Carbon.h>
          #include <stdio.h>
          #include <string.h>
          int main(int argc, char **argv) {
            CFURLRef u = CFURLCreateFromFileSystemRepresentation(NULL, (const UInt8*)argv[1], strlen(argv[1]), true);
            printf("reg=%d\n", (int)TISRegisterInputSource(u));
            return 0;
          }
          EOF
          clang -framework Carbon -o /tmp/reg /tmp/reg.c
          sudo /tmp/reg "/Library/Input Methods/WeType.app"

      - name: lldb dump platform
        run: |
          set -x
          cat > /tmp/hook.py <<'PY'
          import lldb
          def rd(p, a, n):
              e = lldb.SBError()
              d = p.ReadMemory(a, n, e)
              return d if d else b''
          def dump():
              f = lldb.frame
              p = f.GetThread().GetProcess()
              this = f.FindRegister('x0').GetValueAsUnsigned()
              ctx = int.from_bytes(rd(p, this + 0xf0, 8), 'little')
              plat = int.from_bytes(rd(p, ctx + 0x80, 4), 'little')
              print('PLATFORM_INT', plat, flush=True)
              print('THIS', hex(this), 'CTX', hex(ctx), flush=True)
              print('CTX60', rd(p, ctx + 0x60, 0x40).hex(), flush=True)
          PY
          ( lldb -b \
              -o "target create \"/Library/Input Methods/WeType.app/Contents/MacOS/WeType\"" \
              -o "breakpoint set -n _ZN5wetap3net16CronetNetworkApi15GetSvrPublicKeyEhb" \
              -o "process launch" \
              -o "command script import /tmp/hook.py" \
              -o "script import hook; hook.dump()" \
              -o "process kill" > /tmp/lldb.log 2>&1 & echo $! > /tmp/lldb.pid )
          sleep 50
          kill $(cat /tmp/lldb.pid) 2>/dev/null || true
          sleep 1
          echo "=== lldb.log ==="
          cat /tmp/lldb.log | head -80

      - name: Tokens / config
        if: always()
        run: |
          defaults read com.tencent.inputmethod.wetype 2>&1 | head -60 || true
          echo "=== device code strings ==="
          find "$HOME/Library/Application Support/WeType" -type f -size -2M 2>/dev/null | while read f; do strings "$f"; done | grep -aE "^(MAC|AND|WIN|IOS|HAR)[0-9A-Za-z]{20,}" | sort -u | head -10 || true
          tar -czf /tmp/appsupport.tgz -C "$HOME/Library/Application Support" WeType 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: |
            /tmp/lldb.log
            /tmp/appsupport.tgz
          if-no-files-found: warn
