name: probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Install as input method + register
        run: |
          set -x
          curl -fL --retry 3 -o /tmp/app.zip "https://download.weread.qq.com/app/wxkb/mac/3.0.1/WeType_3.0.1_684.zip"
          rm -rf /tmp/app && mkdir -p /tmp/app && unzip -q /tmp/app.zip -d /tmp/app
          sudo mkdir -p "/Library/Input Methods"
          sudo rm -rf "/Library/Input Methods/WeType.app"
          sudo cp -R "/tmp/app/WeType.app" "/Library/Input Methods/"
          sudo chown -R root:wheel "/Library/Input Methods/WeType.app"
          sudo xattr -dr com.apple.quarantine "/Library/Input Methods/WeType.app" || true
          sudo spctl --master-disable || true
          cat > /tmp/reg.c <<'EOF'
          #include <Carbon/Carbon.h>
          #include <stdio.h>
          #include <string.h>
          int main(int argc, char **argv) {
            CFURLRef u = CFURLCreateFromFileSystemRepresentation(NULL, (const UInt8*)argv[1], strlen(argv[1]), true);
            printf("reg=%d\n", (int)TISRegisterInputSource(u));
            return 0;
          }
          EOF
          clang -framework Carbon -o /tmp/reg /tmp/reg.c
          sudo /tmp/reg "/Library/Input Methods/WeType.app"

      - name: lldb dump business task bodies
        run: |
          set -x
          rm -f /tmp/macreq_*.bin
          cat > /tmp/hook.py <<'PY'
          import lldb
          _n = 0
          def bt(frame, bp_loc, internal):
              global _n
              try:
                  p = frame.GetThread().GetProcess()
                  cmd = frame.FindRegister("x0").GetValueAsUnsigned()
                  sub = frame.FindRegister("x1").GetValueAsUnsigned()
                  body = frame.FindRegister("x2").GetValueAsUnsigned()
                  ln = frame.FindRegister("x3").GetValueAsUnsigned()
                  print("TASK", cmd, sub, ln, flush=True)
                  if 0 < ln < 8000000:
                      e = lldb.SBError()
                      d = p.ReadMemory(body, ln, e)
                      if d:
                          open("/tmp/macreq_%d_%d_%d.bin" % (cmd, sub, _n), "wb").write(d)
                          _n += 1
              except Exception as ex:
                  print("ERR", repr(ex), flush=True)
              return False
          PY
          ( lldb -b \
              -o "target create \"/Library/Input Methods/WeType.app/Contents/MacOS/WeType\"" \
              -o "command script import /tmp/hook.py" \
              -o "breakpoint set -n _net_start_task_with_option_v2" \
              -o "breakpoint set -n business_net_start_task_with_option" \
              -o "breakpoint set -n _business_net_start_task_with_option" \
              -o "breakpoint command add -s python -F hook.bt 1 2 3" \
              -o "breakpoint list" \
              -o "process launch" > /tmp/lldb.log 2>&1 & echo $! > /tmp/lldb.pid )
          sleep 70
          kill $(cat /tmp/lldb.pid) 2>/dev/null || true
          sleep 2
          echo "=== tasks:"; grep -aE "^TASK|ERR|Breakpoint" /tmp/lldb.log | head -60
          ls -la /tmp/macreq_*.bin 2>/dev/null | head -20

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: |
            /tmp/lldb.log
            /tmp/macreq_*.bin
          if-no-files-found: warn
