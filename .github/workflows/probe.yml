name: probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Install as input method + register
        run: |
          set -x
          curl -fL --retry 3 -o /tmp/app.zip "https://download.weread.qq.com/app/wxkb/mac/3.0.1/WeType_3.0.1_684.zip"
          rm -rf /tmp/app && mkdir -p /tmp/app && unzip -q /tmp/app.zip -d /tmp/app
          sudo mkdir -p "/Library/Input Methods"
          sudo rm -rf "/Library/Input Methods/WeType.app"
          sudo cp -R "/tmp/app/WeType.app" "/Library/Input Methods/"
          sudo chown -R root:wheel "/Library/Input Methods/WeType.app"
          sudo xattr -dr com.apple.quarantine "/Library/Input Methods/WeType.app" || true
          sudo spctl --master-disable || true
          cat > /tmp/reg.c <<'EOF'
          #include <Carbon/Carbon.h>
          #include <stdio.h>
          #include <string.h>
          int main(int argc, char **argv) {
            CFURLRef u = CFURLCreateFromFileSystemRepresentation(NULL, (const UInt8*)argv[1], strlen(argv[1]), true);
            printf("reg=%d\n", (int)TISRegisterInputSource(u));
            return 0;
          }
          EOF
          clang -framework Carbon -o /tmp/reg /tmp/reg.c
          sudo /tmp/reg "/Library/Input Methods/WeType.app"

      - name: lldb read platform
        run: |
          set -x
          cat > /tmp/hook.py <<'PY'
          import lldb
          def _rd(proc, addr, n):
              err = lldb.SBError()
              d = proc.ReadMemory(addr, n, err)
              return d if d else b''
          def cb(frame, bp_loc, internal):
              try:
                  proc = frame.GetThread().GetProcess()
                  this = frame.FindRegister("x0").GetValueAsUnsigned()
                  ctx = int.from_bytes(_rd(proc, this + 0xf0, 8), 'little')
                  plat = int.from_bytes(_rd(proc, ctx + 0x80, 4), 'little')
                  print("PLATFORM_INT", plat, flush=True)
                  print("CTX_60", _rd(proc, ctx + 0x60, 0x40).hex(), flush=True)
                  print("THIS", hex(this), "CTX", hex(ctx), flush=True)
              except Exception as e:
                  print("HOOKERR", repr(e), flush=True)
              return False
          t = lldb.debugger.GetSelectedTarget()
          bp = t.BreakpointCreateByName("__ZN5wetap3net16CronetNetworkApi15GetSvrPublicKeyEhb")
          print("BP_LOCS", bp.GetNumLocations(), flush=True)
          bp.SetScriptCallbackFunction("hook.cb")
          PY
          ( lldb -b \
              -o "target create \"/Library/Input Methods/WeType.app/Contents/MacOS/WeType\"" \
              -o "command script import /tmp/hook.py" \
              -o "process launch" > /tmp/lldb.log 2>&1 & echo $! > /tmp/lldb.pid )
          sleep 50
          kill $(cat /tmp/lldb.pid) 2>/dev/null || true
          sleep 2
          echo "=== lldb.log ==="
          grep -aE "PLATFORM_INT|CTX_60|BP_LOCS|THIS|HOOKERR|error:|wxime_initialize|cronet|wss" /tmp/lldb.log | head -40
          echo "=== raw ==="
          head -60 /tmp/lldb.log

      - name: Tokens
        if: always()
        run: |
          ls -la "$HOME/Library/Application Support/WeType/business/ddd/2" 2>/dev/null || true
          tar -czf /tmp/appsupport.tgz -C "$HOME/Library/Application Support" WeType 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: |
            /tmp/lldb.log
            /tmp/appsupport.tgz
          if-no-files-found: warn
