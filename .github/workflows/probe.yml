name: probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Install as input method + register
        run: |
          set -x
          curl -fL --retry 3 -o /tmp/app.zip "https://download.weread.qq.com/app/wxkb/mac/3.0.1/WeType_3.0.1_684.zip"
          rm -rf /tmp/app && mkdir -p /tmp/app && unzip -q /tmp/app.zip -d /tmp/app
          sudo mkdir -p "/Library/Input Methods"
          sudo rm -rf "/Library/Input Methods/WeType.app"
          sudo cp -R "/tmp/app/WeType.app" "/Library/Input Methods/"
          sudo chown -R root:wheel "/Library/Input Methods/WeType.app"
          sudo xattr -dr com.apple.quarantine "/Library/Input Methods/WeType.app" || true
          sudo spctl --master-disable || true
          cat > /tmp/reg.c <<'EOF'
          #include <Carbon/Carbon.h>
          #include <stdio.h>
          #include <string.h>
          int main(int argc, char **argv) {
            CFURLRef u = CFURLCreateFromFileSystemRepresentation(NULL, (const UInt8*)argv[1], strlen(argv[1]), true);
            printf("reg=%d\n", (int)TISRegisterInputSource(u));
            return 0;
          }
          EOF
          clang -framework Carbon -o /tmp/reg /tmp/reg.c
          sudo /tmp/reg "/Library/Input Methods/WeType.app"

      - name: Run directly and capture stderr
        run: |
          set -x
          sudo tcpdump -i en0 -s 512 -c 20000 -w /tmp/app.pcap 'host wetype.weixin.qq.com or tcp port 443' > /tmp/tcpdump.log 2>&1 &
          "/Library/Input Methods/WeType.app/Contents/MacOS/WeType" > /tmp/app.out 2>&1 &
          APP=$!
          echo "pid=$APP"
          sleep 75
          pgrep -lf "WeType.app/Contents/MacOS/WeType" || true
          echo "=== platform / wss / uin lines ==="
          grep -aE "platform|os_type|device_code|GetSvrPublicKey|get dh|get Uin|change_uin|business_initialize|net_initialize|cmd_id|5003|crash|cronet" /tmp/app.out | tail -120 || true
          echo "=== full tail ==="
          tail -120 /tmp/app.out || true

      - name: Dump tokens / config
        if: always()
        run: |
          set -x
          defaults read com.tencent.inputmethod.wetype 2>&1 | head -80 || true
          echo "=== device code strings ==="
          find "$HOME/Library/Application Support/WeType" -type f -size -2M 2>/dev/null | while read f; do strings "$f"; done | grep -aE "^(MAC|AND|WIN|IOS|HAR)[0-9A-Za-z]{20,}" | sort -u | head -20 || true
          echo "=== business tokens ==="
          ls -la "$HOME/Library/Application Support/WeType/business/ddd/2" 2>/dev/null || true

      - name: Collect
        if: always()
        run: |
          tar -czf /tmp/appsupport.tgz -C "$HOME/Library/Application Support" WeType 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ github.run_id }}
          path: |
            /tmp/app.out
            /tmp/app.pcap
            /tmp/appsupport.tgz
          if-no-files-found: warn
